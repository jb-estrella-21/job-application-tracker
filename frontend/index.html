<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicons/favicon-dark.svg" sizes="any" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/brand/favicons/favicon-light-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/brand/favicons/favicon-dark-32.png" sizes="32x32" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="/brand/favicons/favicon-light.ico" sizes="16x16 24x24 32x32 48x48 64x64" />
    <link rel="icon" type="image/x-icon" href="/brand/favicons/favicon-dark.ico" sizes="16x16 24x24 32x32 48x48 64x64" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#20544B" />
    <meta name="description" content="A job application tracker for organizing applications and their progress." />
    <title>Track Thy Path</title>
    <script>
      (() => {
        const key = 'job-app-tracker.theme';
        let preference = 'system';

        try {
          const saved = window.localStorage.getItem(key);
          preference = saved === 'light' || saved === 'dark' ? saved : 'system';
        } catch { /* Use the system preference if local storage is unavailable. */ }

        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        document.documentElement.dataset.theme = preference === 'system'
          ? (prefersDark ? 'dark' : 'light')
          : preference;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
